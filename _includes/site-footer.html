<footer class="site-footer">
  <div class="shell site-footer__inner">
    {% if site.data.profile.socials %}
    <ul class="site-footer__socials">
      {% for s in site.data.profile.socials %}
      <li>
        <a class="site-footer__social" href="{{ s.url }}" target="_blank" rel="noopener noreferrer" aria-label="{{ s.name }}">
          {% include social-icon.html icon=s.icon name=s.name %}
        </a>
      </li>
      {% endfor %}
    </ul>
    {% endif %}
    <p class="site-footer__copyright">&copy; {{ site.title }} {{ site.time | date: '%Y' }}</p>
  </div>
</footer>
