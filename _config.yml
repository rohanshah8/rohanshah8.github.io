title: Rohan Shah
url: "https://rohanshah8.github.io"
baseurl: ""
description: >-
  My personal blog where I share thoughts on technology, life, and building things.

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

permalink: pretty
timezone: America/New_York
encoding: utf-8
lang: en-US

collections:
  posts:
    title: Writing
    output: true

defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: card
  - scope:
      path: ""
      type: posts
    values:
      layout: post

navigation_header:
  - title: About
    url: /about/
  - title: Writing
    url: /writing/
  - title: 2026 List
    url: /list_2026/

# Consumed by assets/js/views.js via data attributes on the meta row.
views:
  endpoint: "https://api.counterapi.dev/v1/rohanshah8-github-io"

# Setting `exclude` REPLACES Jekyll's defaults, so the standard entries are
# restated here. `docs` is load-bearing: without it Jekyll parses the Liquid
# inside the spec and plan markdown and the build fails outright.
exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
  - node_modules
  - docs
  - README.md
